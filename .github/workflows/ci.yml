name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends libzbar0 libgl1

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint — ruff (erros reais)
        run: ruff check src/ tests/ --select F541,F811

      - name: Tests — suíte completa (SQLite in-memory)
        run: pytest --tb=short -q
        env:
          DJANGO_SETTINGS_MODULE: app.infrastructure.config.settings_test
